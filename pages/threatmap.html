    import * as THREE from 'three';

    const DEBUG = false;
    const debugPanel = document.querySelector('#debugPanel');

    function debugLog(message, data = null, level = 'log') {
      if (!DEBUG && level !== 'error') return;
      const time = new Date().toLocaleTimeString();
      const line = `[${time}] ${message}`;
      if (debugPanel) {
        debugPanel.classList.toggle('ok', level !== 'error');
        debugPanel.textContent += `\n${line}`;
        if (data) debugPanel.textContent += `\n${typeof data === 'string' ? data : JSON.stringify(data, null, 2)}`;
        debugPanel.scrollTop = debugPanel.scrollHeight;
      }
      const method = level === 'error' ? 'error' : level === 'warn' ? 'warn' : 'log';
      console[method](line, data || '');
    }

    window.addEventListener('error', (event) => {
      debugLog(`JS Error: ${event.message} @ ${event.filename}:${event.lineno}:${event.colno}`, event.error?.stack || '', 'error');
    });

    window.addEventListener('unhandledrejection', (event) => {
      debugLog('Promise Error: 未处理的异步错误', event.reason?.stack || String(event.reason), 'error');
    });

    function assertRuntime(condition, message) {
      if (!condition) throw new Error(message);
    }

    debugLog(`Three.js 已加载：r${THREE.REVISION}`);

    const app = document.querySelector('#app');
    const toggleBtn = document.querySelector('#toggleBtn');
    const modeText = document.querySelector('#modeText');
    const attackFeedList = document.querySelector('#attackFeedList');

    const CONFIG = {

      planeScreenWidthRatio: 0.86,
      planeScreenHeightRatio: 0.58,
      planeAspect: 2.05,

      // 稳定 GeoJSON 世界地图轮廓数据，110m 数据量小，适合 Demo 和前端原型
      worldGeoJsonUrl: 'https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson',

      // 等距圆柱投影夜间地球纹理（2:1），与经纬映射一致，可同时贴球体与平面

    function createSeededRandom(seed = 42) {
      let s = seed >>> 0;
      return () => {
        s = (1664525 * s + 1013904223) >>> 0;
        return s / 0x100000000;
      };
    }

    function randomIpv4(rand) {
      return `${Math.floor(rand() * 223) + 1}.${Math.floor(rand() * 256)}.${Math.floor(rand() * 256)}.${Math.floor(rand() * 256)}`;
    }

    function generateRoutes(count = 100) {
      const rand = createSeededRandom(20260508);
      const generated = [];
      for (let i = 0; i < count; i++) {
        const fromIdx = Math.floor(rand() * attackNodes.length);
        let toIdx = Math.floor(rand() * attackNodes.length);
        if (toIdx === fromIdx) toIdx = (toIdx + 1 + Math.floor(rand() * (attackNodes.length - 1))) % attackNodes.length;
        const from = attackNodes[fromIdx];
        const to = attackNodes[toIdx];
        const detect = CONFIG.detectionTypes[Math.floor(rand() * CONFIG.detectionTypes.length)];
        generated.push({
          name: `${from.city} to ${to.city}`,
          from: { lon: from.lon, lat: from.lat, city: from.city, country: from.country, flag: from.flag },
          to: { lon: to.lon, lat: to.lat, city: to.city, country: to.country, flag: to.flag },
          phase: i / count,
          type: detect.key,
          srcIp: randomIpv4(rand),
          dstIp: randomIpv4(rand),
          packets: 200 + Math.floor(rand() * 9800),
          threatScore: 40 + Math.floor(rand() * 60)
        });
      }
      return generated;
    }

    const routes = generateRoutes(100);

    function getDetectionType(typeKey) {
      return CONFIG.detectionTypes.find((item) => item.key === typeKey) || CONFIG.detectionTypes[0];
    }

    function normalizeRing(rawRing) {
      const ring = rawRing
        .filter((point) => Array.isArray(point) && point.length >= 2)
        .map(([lon, lat]) => [Number(lon), Number(lat)])
        .filter(([lon, lat]) => Number.isFinite(lon) && Number.isFinite(lat));

      if (ring.length < 3) return null;

      const first = ring[0];
      const last = ring[ring.length - 1];
      if (first[0] !== last[0] || first[1] !== last[1]) ring.push([first[0], first[1]]);
      return ring;
    }

    function densifyLonLatPolyline(points, maxStepDeg = 2) {
      const result = [];
      for (let i = 0; i < points.length - 1; i++) {
        const [lon1, lat1] = points[i];
        const [lon2, lat2] = points[i + 1];
        const steps = Math.max(
          1,
          Math.ceil(Math.max(Math.abs(lon2 - lon1), Math.abs(lat2 - lat1)) / maxStepDeg)
        );
        for (let step = 0; step < steps; step++) {
          const t = step / steps;
          result.push([
            lon1 + (lon2 - lon1) * t,
            lat1 + (lat2 - lat1) * t
          ]);
        }
      }
      result.push(points[points.length - 1]);
      return result;
    }

    function extractWorldSegments(geoJson) {
      const segments = [];
      for (const feature of geoJson.features || []) {
        const geometry = feature.geometry;
        if (!geometry) continue;

        if (geometry.type === 'Polygon') {
          const outerRing = normalizeRing(geometry.coordinates[0] || []);
          if (outerRing) segments.push(outerRing);
        }

        if (geometry.type === 'MultiPolygon') {
          for (const polygon of geometry.coordinates || []) {
            const outerRing = normalizeRing(polygon[0] || []);
            if (outerRing) segments.push(outerRing);
          }
        }
      }
      return segments;
    }
    function clearGroup(group) {
      while (group.children.length) {
        const child = group.children.pop();
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
      }
    }

    function lonLatToPlane(lon, lat) {
      const x = (lon / 180) * (state.planeWidth / 2);
      const y = (lat / 90) * (state.planeHeight / 2);
      return new THREE.Vector3(x, y, 0);
    }

    function lonLatToSphere(lon, lat, radius = CONFIG.sphereRadius) {
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon + 180);
      const x = -radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.cos(phi);
      const z = radius * Math.sin(phi) * Math.sin(theta);
      return new THREE.Vector3(x, y, z);
    }

    function slerpVector3(from, to, t) {
      const start = from.clone().normalize();
      const end = to.clone().normalize();
      const dot = THREE.MathUtils.clamp(start.dot(end), -1, 1);
      const theta = Math.acos(dot) * t;
      const relative = end.sub(start.clone().multiplyScalar(dot)).normalize();
      return start.multiplyScalar(Math.cos(theta)).add(relative.multiplyScalar(Math.sin(theta))).normalize();
    }

    function getMorphBlend(rawMorph) {
      const morph = THREE.MathUtils.clamp(rawMorph, 0, 1);
      return {
        // XY 保持球面轮廓更久，后段再快速铺平，减少“整张面在转”的感觉。
        xy: THREE.MathUtils.smootherstep(morph, 0.2, 0.96),
        // Z 提前压平，让展开更像投影摊开而不是整体翻转。
        z: THREE.MathUtils.smoothstep(morph, 0.05, 0.8),
        // 中段给经线两侧少量卷曲，模拟“解卷”过程。
        transition: Math.sin(Math.PI * morph)
      };
    }

    function mixPosition(lon, lat, extraRadius = 0) {
      const plane = lonLatToPlane(lon, lat);
      const sphere = lonLatToSphere(lon, lat, CONFIG.sphereRadius + extraRadius);
      const blend = getMorphBlend(state.morph);
      const mixed = plane.clone().lerp(sphere, blend.xy);
      mixed.z = THREE.MathUtils.lerp(plane.z, sphere.z, blend.z);

      const seamFactor = Math.pow(Math.abs(lon) / 180, 1.15);
      mixed.z += seamFactor * blend.transition * 0.22 * (1 - blend.xy);
      return mixed;
    }

    function getSphereFacingAmountFromPoint(point) {
      const normal = point.clone().normalize();
      const cameraNormal = camera.position.clone().normalize();
      return normal.dot(cameraNormal);
    }

    function isLonLatFacingCamera(lon, lat, margin = CONFIG.sphereHorizonMargin) {
      const surfaceNormal = lonLatToSphere(lon, lat, 1).normalize();
      const cameraNormal = camera.position.clone().normalize();
      return surfaceNormal.dot(cameraNormal) > margin;
    }

    /** 每条路线创建时随机一次：近程低弧、远程高弧，且始终高于球面。 */
    function ensureRouteArcParams(route) {
      if (route._arcParamsReady) return;
      const a = lonLatToSphere(route.from.lon, route.from.lat, 1).normalize();
      const b = lonLatToSphere(route.to.lon, route.to.lat, 1).normalize();
      const dot = THREE.MathUtils.clamp(a.dot(b), -1, 1);
      const angle = Math.acos(dot);
      const distFactor = angle / Math.PI;

      route.minSurfaceOffset = 0.18;
      const blend = 0.1 + 0.9 * distFactor;
      const jitter = 0.28 + Math.random() * 0.87;
      route.arcHeight = THREE.MathUtils.clamp(blend * jitter, 0.16, 1.15);
      route._arcParamsReady = true;
    }

    function makeLineMaterial(color, opacity, linewidth = 1) {
      return new THREE.LineBasicMaterial({
        color,
        transparent: true,
        opacity,
        linewidth,
        depthWrite: false,
        depthTest: true
      });
    }

    function createPolyline(points, material) {
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(points.length * 3);
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const line = new THREE.Line(geometry, material);
      line.userData.points = points;
      return line;
    }

    function createPlaneRoutePoints(route, count = ROUTE_POINT_COUNT) {
      const from = lonLatToPlane(route.from.lon, route.from.lat);
      const to = lonLatToPlane(route.to.lon, route.to.lat);
      const points = [];
      const distance = from.distanceTo(to);
      const arcHeightMax = Math.min(
        1.35,
        distance * (0.055 + route.arcHeight * 0.11)
      );
      for (let i = 0; i <= count; i++) {
        const t = i / count;
        const p = from.clone().lerp(to, t);
        p.y += Math.sin(Math.PI * t) * arcHeightMax;
        p.z += route.minSurfaceOffset;
        points.push(p);
      }
      return points;
    }
    function createSphereRoutePoints(route, count = ROUTE_POINT_COUNT) {
      const from = lonLatToSphere(route.from.lon, route.from.lat, CONFIG.sphereRadius).normalize();
      const to = lonLatToSphere(route.to.lon, route.to.lat, CONFIG.sphereRadius).normalize();
      const points = [];
      const baseR = CONFIG.sphereRadius + route.minSurfaceOffset;
      const amp = route.arcHeight;

      for (let i = 0; i <= count; i++) {
        const t = i / count;
        const p = slerpVector3(from, to, t);
        const lift = Math.sin(Math.PI * t) * amp;
        p.multiplyScalar(baseR + lift);
        points.push(p);
      }

      return points;
    }
    function getMorphRoutePoints(route, count = ROUTE_POINT_COUNT) {
      ensureRouteArcParams(route);
      const planeKey = `${state.planeWidth},${state.planeHeight}`;
      if (route._cachedPlaneKey !== planeKey) {
        route._cachedPlaneKey = planeKey;
        route._cachedPlanePoints = createPlaneRoutePoints(route, count);
      }
      if (!route._cachedSpherePoints) {
        route._cachedSpherePoints = createSphereRoutePoints(route, count);
      }
      const planePoints = route._cachedPlanePoints;
      const spherePoints = route._cachedSpherePoints;
      return planePoints.map((point, index) => {
        return point.clone().lerp(spherePoints[index], state.morph);
      });
    }

    function getRouteFlightState(route, time) {
      const cycleLength = 1 + CONFIG.cometLandingHold;
      CONFIG.cometSpeed = 1 / Math.max(0.1, CONFIG.cometFlightDuration);
      const rawCycle = (time * CONFIG.cometSpeed + route.phase) % cycleLength;
      const hasReachedImpactPoint = rawCycle >= CONFIG.impactTriggerT;
      const hasLanded = rawCycle >= 1;

      return {
        rawCycle,
        flightT: Math.min(rawCycle, 1),
        hasReachedImpactPoint,
        hasLanded,
        landingT: hasLanded ? (rawCycle - 1) / CONFIG.cometLandingHold : 0
      };
    }
    function createRouteLine(route) {
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array((ROUTE_POINT_COUNT + 1) * 3);
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const material = new THREE.LineBasicMaterial({
        color: 0xff3838,
        transparent: true,
        opacity: 0,
        depthWrite: false,
        depthTest: false
      });

      const line = new THREE.Line(geometry, material);
      line.userData.kind = 'routeLine';
      line.userData.route = route;
      line.visible = false;
      line.renderOrder = 1;
      routeGroup.add(line);
    }

    function sampleRoutePoint(points, t) {
      const clampedT = THREE.MathUtils.clamp(t, 0, 1);
      const floatIndex = clampedT * (points.length - 1);
      const indexA = Math.floor(floatIndex);
      const indexB = Math.min(points.length - 1, indexA + 1);
      const localT = floatIndex - indexA;
      return points[indexA].clone().lerp(points[indexB], localT);
    }

    function getRibbonWidthByRatio(ratio) {
      const endLength = THREE.MathUtils.clamp(CONFIG.cometRibbonEndLengthRatio, 0.12, 0.42);
      const leftGrow = THREE.MathUtils.smoothstep(ratio, 0, endLength);
      const rightGrow = 1 - THREE.MathUtils.smoothstep(ratio, 1 - endLength, 1);
      const envelope = THREE.MathUtils.clamp(leftGrow * rightGrow, 0, 1);
      return CONFIG.cometRibbonEndWidth +
        envelope * (CONFIG.cometRibbonMidWidth - CONFIG.cometRibbonEndWidth);
    }
    function getRibbonOpacityByRatio(ratio) {
      const endLength = THREE.MathUtils.clamp(CONFIG.cometRibbonEndLengthRatio, 0.12, 0.42);
      const leftGrow = THREE.MathUtils.smoothstep(ratio, 0, endLength);
      const rightGrow = 1 - THREE.MathUtils.smoothstep(ratio, 1 - endLength, 1);
      const envelope = THREE.MathUtils.clamp(leftGrow * rightGrow, 0, 1);
      return CONFIG.cometRibbonEndOpacity +
        envelope * (CONFIG.cometRibbonMidOpacity - CONFIG.cometRibbonEndOpacity);
    }

    function createRouteComet(route) {
      const detectionType = getDetectionType(route.type);
      const routeColor = new THREE.Color(detectionType.color);
      const geometry = new THREE.BufferGeometry();
      const vertexCount = CONFIG.cometRibbonPointCount * 2;
      const positions = new Float32Array(vertexCount * 3);
      const colors = new Float32Array(vertexCount * 4);
      const uvs = new Float32Array(vertexCount * 2);
      const indices = [];

      for (let i = 0; i < CONFIG.cometRibbonPointCount; i++) {
        const v = i / Math.max(1, CONFIG.cometRibbonPointCount - 1);
        const uvBase = i * 4;
        uvs[uvBase] = 0;
        uvs[uvBase + 1] = v;
        uvs[uvBase + 2] = 1;
        uvs[uvBase + 3] = v;
      }

      for (let i = 0; i < CONFIG.cometRibbonPointCount - 1; i++) {
        const a = i * 2;
        const b = a + 1;
        const c = a + 2;
        const d = a + 3;
        indices.push(a, b, c, b, d, c);
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 4));
      geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 999);

      const material = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        depthTest: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        toneMapped: false,
        uniforms: {
          uOpacity: { value: CONFIG.cometRibbonOpacity },
          uEdgeSoftness: { value: CONFIG.cometRibbonEdgeSoftness },
          uFadeIn: { value: CONFIG.cometRibbonLengthFadeIn },
          uFadeOut: { value: CONFIG.cometRibbonLengthFadeOut },
          uGlowStrength: { value: CONFIG.cometRibbonGlowStrength }
        },
        vertexShader: `
          attribute vec4 color;
          varying vec2 vUv;
          varying vec4 vColor;

          void main() {
            vUv = uv;
            vColor = color;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          precision mediump float;

          uniform float uOpacity;
          uniform float uEdgeSoftness;
          uniform float uFadeIn;
          uniform float uFadeOut;
          uniform float uGlowStrength;

          varying vec2 vUv;
          varying vec4 vColor;

          void main() {
            float edge = 1.0 - abs(vUv.x - 0.5) * 2.0;
            edge = pow(clamp(edge, 0.0, 1.0), uEdgeSoftness);

            float fadeIn = smoothstep(0.0, uFadeIn, vUv.y);
            float fadeOut = 1.0 - smoothstep(uFadeOut, 1.0, vUv.y);
            float lengthFade = fadeIn * fadeOut;

            float alpha = vColor.a * edge * lengthFade * uOpacity;
            vec3 color = vColor.rgb * uGlowStrength;

            if (alpha <= 0.001) discard;
            gl_FragColor = vec4(color, alpha);
          }
        `
      });

      const comet = new THREE.Mesh(geometry, material);
      comet.userData.kind = 'routeComet';
      comet.userData.route = route;
      comet.userData.positions = positions;
      comet.userData.colors = colors;
      comet.userData.routeColor = routeColor;
      comet.userData.detectionType = detectionType;
      comet.renderOrder = 35;
      routeGroup.add(comet);
    }

    function createImpactWave(route) {
      const detectionType = getDetectionType(route.type);
      const routeColor = detectionType.color;
      const waveGroup = new THREE.Group();
      waveGroup.userData.kind = 'impactWave';
      waveGroup.userData.route = route;
      waveGroup.renderOrder = 32;
      const geometry = new THREE.TorusGeometry(0.11, 0.008, 8, 64);
      for (let i = 0; i < 3; i++) {
        const material = new THREE.MeshBasicMaterial({
          color: routeColor,
          transparent: true,
          opacity: 0,
          depthWrite: false,
          depthTest: false,
          blending: THREE.AdditiveBlending
        });
        const wave = new THREE.Mesh(geometry, material);
        wave.userData.waveIndex = i;
        waveGroup.add(wave);
      }
      waveGroup.visible = false;
      routeGroup.add(waveGroup);
    }
    function createRoutes() {
      clearGroup(routeGroup);
      for (const route of routes) {
        createRouteLine(route);
        createRouteComet(route);
        createImpactWave(route);
      }
      debugLog('轨迹线创建完成', {
        routeCount: routes.length,
        routeObjects: routeGroup.children.length
      });
    }
    function updateRouteLine(line, isSphereView) {
      // 固定轨迹线只作为调试对象保留，默认隐藏。
      // 真正展示的是 routeComet 的细长拖尾。
      line.visible = false;
    }

    function updateRouteComet(comet, time, isSphereView) {
      const route = comet.userData.route;
      const points = getMorphRoutePoints(route, ROUTE_POINT_COUNT);
      const flightState = getRouteFlightState(route, time);
      const headT = flightState.hasReachedImpactPoint ? 1 : flightState.flightT;
      const absorbProgress = flightState.hasReachedImpactPoint
        ? THREE.MathUtils.clamp(
          (flightState.rawCycle - CONFIG.cometAbsorbStartT) / Math.max(0.001, CONFIG.cometLandingHold),
          0,
          1
        )
        : 0;
      const absorbEase = Math.pow(absorbProgress, CONFIG.cometAbsorbPower);
      const impactPoint = points[ROUTE_POINT_COUNT];
      // Insert: hide comet if impactPoint is not facing camera in sphere mode
      if (isSphereView && getSphereFacingAmountFromPoint(impactPoint) < CONFIG.sphereCometHorizonMargin) {
        comet.visible = false;
        return;
      }
      const ribbonPoints = [];

      for (let i = 0; i < CONFIG.cometRibbonPointCount; i++) {
        const t = headT - i * CONFIG.cometRibbonSpacing;
        if (t < 0 || t > 1) continue;

        const sourcePoint = sampleRoutePoint(points, t);
        // Insert: skip ribbon points not facing camera in sphere mode
        if (isSphereView && getSphereFacingAmountFromPoint(sourcePoint) < CONFIG.sphereCometHorizonMargin) {
          continue;
        }
        const absorbedPoint = sourcePoint.clone().lerp(impactPoint, absorbEase);
        ribbonPoints.push(absorbedPoint);
      }

      ribbonPoints.reverse();
      // reverse 后 index 0 = 沿轨迹最靠后的尾巴尖端（最后才吸进落点的那一个采样）

      const tailTipEps = CONFIG.cometRibbonTailTipCollapseDistance;
      const tailTipEpsSq = tailTipEps * tailTipEps;
      if (ribbonPoints.length >= 1) {
        const tailTip = ribbonPoints[0];
        if (tailTip.distanceToSquared(impactPoint) < tailTipEpsSq) {
          comet.visible = false;
          return;
        }
      }

      if (ribbonPoints.length < 2) {
        return;
      }

      const positionAttr = comet.geometry.getAttribute('position');
      const colorAttr = comet.geometry.getAttribute('color');
      const positions = positionAttr.array;
      const colors = colorAttr.array;
      const cameraDir = new THREE.Vector3();
      const tangent = new THREE.Vector3();
      const side = new THREE.Vector3();
      const left = new THREE.Vector3();
      const right = new THREE.Vector3();

      camera.getWorldDirection(cameraDir);

      for (let i = 0; i < CONFIG.cometRibbonPointCount; i++) {
        const point = ribbonPoints[Math.min(i, ribbonPoints.length - 1)];
        const prev = ribbonPoints[Math.max(0, Math.min(i - 1, ribbonPoints.length - 1))];
        const next = ribbonPoints[Math.min(i + 1, ribbonPoints.length - 1)];
        const ratio = i / Math.max(1, CONFIG.cometRibbonPointCount - 1);
        const isActive = i < ribbonPoints.length;

        tangent.copy(next).sub(prev).normalize();
        side.crossVectors(tangent, cameraDir).normalize();

        if (!Number.isFinite(side.x) || side.lengthSq() < 0.000001) {
          side.set(1, 0, 0);
        }

        const width =
          CONFIG.cometRibbonWidth *
          getRibbonWidthByRatio(ratio) *
          Math.max(0.08, 1 - absorbEase * 0.92);
        left.copy(point).addScaledVector(side, width);
        right.copy(point).addScaledVector(side, -width);

        const base = i * 6;
        positions[base] = left.x;
        positions[base + 1] = left.y;
        positions[base + 2] = left.z;
        positions[base + 3] = right.x;
        positions[base + 4] = right.y;
        positions[base + 5] = right.z;

        const opacity = isActive ? getRibbonOpacityByRatio(ratio) : 0;
        const colorBase = i * 8;
        const routeColor = comet.userData.routeColor;
        colors[colorBase] = routeColor.r;
        colors[colorBase + 1] = routeColor.g;
        colors[colorBase + 2] = routeColor.b;
        colors[colorBase + 3] = opacity;
        colors[colorBase + 4] = routeColor.r;
        colors[colorBase + 5] = routeColor.g;
        colors[colorBase + 6] = routeColor.b;
        colors[colorBase + 7] = opacity;
      }

      positionAttr.needsUpdate = true;
      colorAttr.needsUpdate = true;
      comet.geometry.setDrawRange(0, Math.max(0, (ribbonPoints.length - 1) * 6));
      comet.material.uniforms.uOpacity.value = CONFIG.cometRibbonOpacity;
      comet.material.uniforms.uEdgeSoftness.value = CONFIG.cometRibbonEdgeSoftness;
      comet.material.uniforms.uFadeIn.value = CONFIG.cometRibbonLengthFadeIn;
      comet.material.uniforms.uFadeOut.value = CONFIG.cometRibbonLengthFadeOut;
      comet.material.uniforms.uGlowStrength.value = CONFIG.cometRibbonGlowStrength;
      comet.material.depthTest = isSphereView;
      comet.visible = true;
      comet.renderOrder = isSphereView ? 14 : 35;
    }

    function updateImpactWave(waveGroup, time, isSphereView, isTransitioning) {
      const route = waveGroup.userData.route;
      const flightState = getRouteFlightState(route, time);
      const isImpactWindow = flightState.hasReachedImpactPoint && flightState.rawCycle >= CONFIG.impactTriggerT && flightState.rawCycle <= 1 + CONFIG.cometLandingHold;
      const isImpactFacingCamera = !isSphereView || isLonLatFacingCamera(route.to.lon, route.to.lat, CONFIG.sphereHorizonMargin);

      waveGroup.visible = isImpactWindow && !isTransitioning && isImpactFacingCamera;

      const impactOffset = isSphereView ? CONFIG.sphereImpactSurfaceOffset : 0.24;
      const p = mixPosition(route.to.lon, route.to.lat, impactOffset);
      p.z += (1 - state.morph) * 0.2;
      waveGroup.position.copy(p);

      const normal = isSphereView
        ? lonLatToSphere(route.to.lon, route.to.lat, 1).normalize()
        : new THREE.Vector3(0, 0, 1);
      waveGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);

      for (const wave of waveGroup.children) {
        const impactProgress = THREE.MathUtils.clamp(
          (flightState.rawCycle - CONFIG.impactTriggerT) / Math.max(0.001, CONFIG.cometLandingHold),
          0,
          1
        );
        const layerLife = THREE.MathUtils.clamp(
          (impactProgress - wave.userData.waveIndex * CONFIG.impactWaveLayerDelay) / Math.max(0.001, CONFIG.impactWaveDuration),
          0,
          1
        );
        const visible = isImpactWindow && isImpactFacingCamera && layerLife > 0 && layerLife < 1 && !isTransitioning;
        wave.scale.setScalar(0.38 + layerLife * CONFIG.impactWaveMaxScale);
        wave.material.opacity = visible ? (1 - layerLife) * 0.78 : 0;
        wave.material.depthTest = isSphereView;
        wave.material.depthWrite = false;
        wave.visible = visible;
        wave.renderOrder = isSphereView ? 14 + wave.userData.waveIndex : 32 + wave.userData.waveIndex;
      }
    }

    function updateRoutes(time) {
      const morphDistance = Math.abs(state.morph - state.targetMorph);
      const isTransitioning = state.isModeTransitioning || morphDistance > 0.006;
      const isSphereView = state.targetMode === 'sphere' && state.morph >= CONFIG.sphereReadyMorph;

      // 需求：点击切换的瞬间，轨迹线/彗星/冲击波立即消失，不等待 morph 走到阈值。
      // 等平面或球体真正稳定后，再重新显示对应模式下的轨迹效果。
      routeGroup.visible = !isTransitioning;
      if (!routeGroup.visible) return;

      for (const item of routeGroup.children) {
        if (item.userData.kind === 'routeLine') updateRouteLine(item, isSphereView);
        if (item.userData.kind === 'routeComet') updateRouteComet(item, time, isSphereView);
        if (item.userData.kind === 'impactWave') updateImpactWave(item, time, isSphereView, isTransitioning);
      }
    }

    function createGrid() {
      const gridMaterial = makeLineMaterial(0x4f1616, 0.46);
      for (let lat = -60; lat <= 60; lat += 20) {
        const points = [];
        for (let lon = -180; lon <= 180; lon += 4) points.push([lon, lat]);
        gridGroup.add(createPolyline(points, gridMaterial));
      }
      for (let lon = -180; lon <= 180; lon += 30) {
        const points = [];
        for (let lat = -80; lat <= 80; lat += 4) points.push([lon, lat]);
        gridGroup.add(createPolyline(points, gridMaterial));
      }
    }

    /**
     * @param {THREE.Texture | null} nightTexture 等距圆柱夜间地球贴图；与平面/球体共用同一张图
     */
    function createSphereSurface(nightTexture = null) {
      clearGroup(sphereSurfaceGroup);
      const surfaceGeometry = new THREE.SphereGeometry(CONFIG.sphereRadius - 0.04, 128, 80);
      const hasMap = Boolean(nightTexture);
      const surfaceMaterial = new THREE.MeshStandardMaterial({
        color: hasMap ? 0xffffff : 0x070707,
        map: nightTexture,
        roughness: hasMap ? 0.88 : 0.94,
        metalness: hasMap ? 0.02 : 0.02,
        transparent: true,
        opacity: 0,
        emissive: hasMap ? 0x1a0508 : 0x180000,
        emissiveIntensity: hasMap ? 0.12 : 0.22,
        emissiveMap: hasMap ? nightTexture : null,
        side: THREE.FrontSide,
        depthWrite: true,
        depthTest: true
      });
      const surface = new THREE.Mesh(surfaceGeometry, surfaceMaterial);
      surface.visible = true;
      surface.renderOrder = -20;
      sphereSurfaceGroup.add(surface);
    }

    /**
     * 平面模式底图：与 lonLatToPlane 同一宽高，经纬与 GeoJSON 对齐
     * @param {THREE.Texture | null} nightTexture
     */
    function createEarthNightPlane(nightTexture) {
      clearGroup(earthNightPlaneGroup);
      earthNightPlaneMesh = null;
      if (!nightTexture) return;

      // 与球体材质分开 Texture 对象，避免 clearGroup → material.dispose 时释放共用贴图
      const planeTex = nightTexture.clone();
      planeTex.colorSpace = THREE.SRGBColorSpace;
      planeTex.anisotropy = nightTexture.anisotropy;
      // Loader 默认 flipY=true 适合球体等；平面 Plate Carrée 与 lonLatToPlane 一致时必须关掉，
      // 否则会与默认 Plane UV（北 v=0）叠加成纬度反向，轮廓与夜景错位。
      planeTex.flipY = false;
      planeTex.needsUpdate = true;

      const geometry = new THREE.PlaneGeometry(1, 1, 1, 1);
      {
        const pos = geometry.getAttribute('position');
        const uv = geometry.getAttribute('uv');
        for (let i = 0; i < uv.count; i++) {
          const x = pos.getX(i);
          const y = pos.getY(i);
          const lon = x * 360;
          const lat = y * 180;
          uv.setXY(i, (lon + 180) / 360, (90 - lat) / 180);
        }
        uv.needsUpdate = true;
      }
      const material = new THREE.MeshStandardMaterial({
        map: planeTex,
        color: 0xffffff,
        roughness: 1,
        metalness: 0,
        emissive: 0x120408,
        emissiveIntensity: 0.08,
        emissiveMap: planeTex,
        transparent: true,
        opacity: 1,
        side: THREE.FrontSide,
        depthWrite: true,
        depthTest: true
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.z = -0.09;
      mesh.renderOrder = -18;
      earthNightPlaneGroup.add(mesh);
      earthNightPlaneMesh = mesh;
      updateEarthNightPlaneSize();
    }

    function updateEarthNightPlaneSize() {
      if (!earthNightPlaneMesh) return;
      earthNightPlaneMesh.scale.set(state.planeWidth, state.planeHeight, 1);
    }

    function createLandAndBorders() {
      clearGroup(landGroup);
      clearGroup(borderGroup);
      const fillMaterial = new THREE.MeshStandardMaterial({
        color: 0x242424,
        roughness: 0.86,
        metalness: 0.03,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 1,
        emissive: 0x210000,
        emissiveIntensity: 0.32,
        depthWrite: true,
        depthTest: true
      });

      const borderMaterial = makeLineMaterial(0xff3a3a, 1);
      const isAntarcticaPolygon = (polygon) => {
        let maxLat = -Infinity;
        for (const [, lat] of polygon) {
          if (lat > maxLat) maxLat = lat;
        }
        // 南极洲整体纬度很低：仅屏蔽其红色轮廓线，避免与底图错位显眼
        return maxLat < -58;
      };

      for (const polygon of worldSegments) {
        const isAntarctica = isAntarcticaPolygon(polygon);
        const shape = new THREE.Shape();
        polygon.forEach(([lon, lat], index) => {
          const p = lonLatToPlane(lon, lat);
          if (index === 0) shape.moveTo(p.x, p.y);
          else shape.lineTo(p.x, p.y);
        });

        const geometry = new THREE.ShapeGeometry(shape, 12);
        geometry.userData.lonLat = polygon;
        geometry.userData.sourcePositions = Float32Array.from(geometry.getAttribute('position').array);

        const mesh = new THREE.Mesh(geometry, fillMaterial);
        mesh.userData.type = 'land';
        mesh.userData.sourcePositions = geometry.userData.sourcePositions;
        mesh.userData.isAntarctica = isAntarctica;
        landGroup.add(mesh);

        const borderLine = createPolyline(densifyLonLatPolyline(polygon, 1.4), borderMaterial);
        borderLine.userData.isAntarctica = isAntarctica;
        borderGroup.add(borderLine);
      }
    }
    async function loadStableWorldData() {
      debugLog('开始加载 GeoJSON 地图数据', CONFIG.worldGeoJsonUrl);
      try {
        const response = await fetch(CONFIG.worldGeoJsonUrl, { cache: 'force-cache' });
        if (!response.ok) throw new Error(`GeoJSON 加载失败：${response.status}`);
        const geoJson = await response.json();
        const segments = extractWorldSegments(geoJson);
        debugLog('GeoJSON 加载成功', { featureCount: geoJson.features?.length || 0, segmentCount: segments.length });
        worldSegments = segments.length ? segments : fallbackWorldSegments;
      } catch (error) {
        console.warn('稳定 GeoJSON 加载失败，使用内置简化轮廓兜底：', error);
        debugLog('GeoJSON 加载失败，使用 fallbackWorldSegments', error.stack || error.message, 'warn');
        worldSegments = fallbackWorldSegments;
      }

      createLandAndBorders();
      debugLog('地图轮廓创建完成', { landMeshes: landGroup.children.length, borderLines: borderGroup.children.length });
    }

    function createGlowDots() {
      clearGroup(glowGroup);

      const dotGeometry = new THREE.SphereGeometry(0.055, 12, 12);
      const dotMaterial = new THREE.MeshBasicMaterial({
        color: 0xff3030,
        transparent: true,
        opacity: 0.96,
        depthWrite: false,
        depthTest: false
      });

      const dotLocations = [
        [-74, 40], [-122, 37], [-46, -23], [2, 48], [13, 52], [37, 55], [77, 28], [103, 1], [116, 39], [139, 35], [151, -33]
      ];

      for (const [lon, lat] of dotLocations) {
        const dot = new THREE.Mesh(dotGeometry, dotMaterial);
        dot.userData.lon = lon;
        dot.userData.lat = lat;
        dot.renderOrder = 30;
        glowGroup.add(dot);
      }
    }

    function createAttackFeed() {
      if (!attackFeedList) return;
      const html = routes.map((route) => {
        return `
          <li class="feed-item">
            <div class="feed-main">
              <span class="feed-flag">${route.from.flag}</span>
              <span>${route.srcIp}</span>
              <span>→</span>
              <span class="feed-flag">${route.to.flag}</span>
              <span>${route.dstIp}</span>
            </div>
            <div class="feed-data">${route.type} | ${route.packets} pkt | T${route.threatScore}</div>
          </li>
        `;
      }).join('');

      // 双份列表用于无缝滚动。
      attackFeedList.innerHTML = html + html;

      let offset = 0;
      let lastTs = 0;
      const speed = 32;

      function scrollFeed(ts) {
        if (!lastTs) lastTs = ts;
        const dt = (ts - lastTs) / 1000;
        lastTs = ts;
        offset += speed * dt;
        const loopHeight = attackFeedList.scrollHeight / 2;
        if (offset >= loopHeight) offset -= loopHeight;
        attackFeedList.style.transform = `translate3d(0, ${-offset}px, 0)`;
        requestAnimationFrame(scrollFeed);
      }

      requestAnimationFrame(scrollFeed);
    }

    function updateLines() {
      const allLines = [...gridGroup.children, ...borderGroup.children];
      const isPlaneView = state.morph < 0.28;
      for (const line of allLines) {
        // 仅在平面模式隐藏南极红色轮廓，球体模式保留。
        if (line.userData.isAntarctica) {
          line.visible = !isPlaneView;
          if (!line.visible) continue;
        } else {
          line.visible = true;
        }

        const attr = line.geometry.getAttribute('position');
        const points = line.userData.points;

        for (let i = 0; i < points.length; i++) {
          const [lon, lat] = points[i];
          const extra = 0.035;
          const p = mixPosition(lon, lat, extra);
          attr.setXYZ(i, p.x, p.y, p.z);
        }
        attr.needsUpdate = true;
        line.geometry.computeBoundingSphere();
      }
    }

    function updateLandMeshes() {
      if (Math.abs(state.lastGeometryMorph - state.morph) < 0.0008) return;
      state.lastGeometryMorph = state.morph;

      for (const mesh of landGroup.children) {
        const position = mesh.geometry.getAttribute('position');
        const source = mesh.userData.sourcePositions;
        if (!source) continue;

        for (let i = 0; i < position.count; i++) {
          const x = source[i * 3];
          const y = source[i * 3 + 1];
          const lon = (x / (state.planeWidth / 2)) * 180;
          const lat = (y / (state.planeHeight / 2)) * 90;
          const p = mixPosition(lon, lat, 0.012);
          position.setXYZ(i, p.x, p.y, p.z);
        }
        position.needsUpdate = true;
        mesh.geometry.computeVertexNormals();
        mesh.geometry.computeBoundingSphere();
      }
    }

    function updateSphereSurface() {
      const surfaceOpacity = THREE.MathUtils.smoothstep(state.morph, 0.06, 0.82);
      const landOpacity = 1 - THREE.MathUtils.smoothstep(state.morph, 0.56, 0.86);
      const isPlaneView = state.morph < 0.28;

      for (const surface of sphereSurfaceGroup.children) {
        surface.visible = surfaceOpacity > 0.001;
        surface.material.opacity = surfaceOpacity;
        surface.material.depthWrite = surfaceOpacity > 0.65;
      }

      landGroup.visible = landOpacity > 0.001;
      for (const land of landGroup.children) {
        if (land.userData.isAntarctica) {
          land.visible = !isPlaneView && landOpacity > 0.001;
        } else {
          land.visible = landOpacity > 0.001;
        }
        land.material.opacity = landOpacity;
        land.material.depthWrite = landOpacity > 0.65;
      }

      // 平面夜间底图与矢量陆地同步淡出，球体侧由 sphere 上的同一张纹理渐显
      if (earthNightPlaneMesh) {
        earthNightPlaneMesh.visible = landOpacity > 0.001;
        earthNightPlaneMesh.material.opacity = landOpacity;
        earthNightPlaneMesh.material.depthWrite = landOpacity > 0.65;
      }
    }

    function updateGlowDots(time) {
      const isSphereView = state.morph > 0.72;

      for (const dot of glowGroup.children) {
        const p = mixPosition(dot.userData.lon, dot.userData.lat, 0.18);

        // 平面模式下给点位一个屏幕前景偏移，避免和大陆面片共面导致被遮挡或闪烁。
        p.z += (1 - state.morph) * 0.18;

        dot.position.copy(p);

        const pulse = 1 + Math.sin(time * 4 + dot.userData.lon) * 0.28;
        dot.scale.setScalar(pulse * (state.morph > 0.5 ? 1.08 : 0.92));

        // 平面模式：点位是 UI/Overlay，不参与深度测试，永远显示在地图上方。
        // 球体模式：点位重新参与深度测试，背面点会被不透明球体挡住。
        dot.material.depthTest = isSphereView;
        dot.material.depthWrite = false;
        dot.renderOrder = isSphereView ? 8 : 30;
      }
    }

    function updatePlaneSize() {
      const fovRad = THREE.MathUtils.degToRad(camera.fov);
      const visibleHeight = 2 * (10 / state.zoomFactor) * Math.tan(fovRad / 2);
      const visibleWidth = visibleHeight * (window.innerWidth / Math.max(window.innerHeight, 1));
      const maxWidth = visibleWidth * 0.97;
      const maxHeight = visibleHeight * 0.9;

      let width = maxWidth;
      let height = width / CONFIG.planeAspect;
      if (height > maxHeight) {
        height = maxHeight;
        width = height * CONFIG.planeAspect;
      }

      state.planeWidth = width;
      state.planeHeight = height;
    }

    function applyLayoutMode(mode) {
      document.body.classList.toggle('mode-sphere', mode === 'sphere');
      document.body.classList.toggle('mode-plane', mode !== 'sphere');
    }

    function setFixedPlaneCamera() {
      const distance = 10 / state.zoomFactor;
      camera.position.set(0, 0, distance);
      camera.rotation.set(0, 0, 0);
      camera.lookAt(0, 0, 0);
    }

    function setFixedSphereCamera() {
      const distance = CONFIG.sphereCameraDistance / state.zoomFactor;
      camera.position.set(0, CONFIG.sphereCameraHeight, distance);
      camera.lookAt(0, CONFIG.sphereLookAtHeight, 0);
    }

    function updateCamera() {
      state.sphereYaw = THREE.MathUtils.damp(state.sphereYaw, state.targetSphereYaw, 9, 0.016);
      state.spherePitch = THREE.MathUtils.damp(state.spherePitch, state.targetSpherePitch, 9, 0.016);
      const cameraMorph = THREE.MathUtils.smootherstep(state.morph, 0.12, 0.94);

      const planePosition = new THREE.Vector3(0, 0, 10 / state.zoomFactor);

      const distance = CONFIG.sphereCameraDistance / state.zoomFactor;
      const sphereX = Math.sin(state.sphereYaw) * Math.cos(state.spherePitch) * distance;
      const sphereY = CONFIG.sphereCameraHeight + Math.sin(state.spherePitch) * 2.6;
      const sphereZ = Math.cos(state.sphereYaw) * Math.cos(state.spherePitch) * distance;
      const spherePosition = new THREE.Vector3(sphereX, sphereY, sphereZ);

      const planeLookAt = new THREE.Vector3(0, 0, 0);
      const sphereLookAt = new THREE.Vector3(0, CONFIG.sphereLookAtHeight, 0);
      const currentPosition = planePosition.lerp(spherePosition, cameraMorph);
      const currentLookAt = planeLookAt.lerp(sphereLookAt, cameraMorph);

      camera.position.copy(currentPosition);
      camera.lookAt(currentLookAt);
    }

    function lockUserMovement() {
      renderer.domElement.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        if (state.targetMode !== 'sphere' || state.morph < 0.86) return;
        state.isDragging = true;
        state.lastPointerX = event.clientX;
        state.lastPointerY = event.clientY;
        renderer.domElement.setPointerCapture(event.pointerId);
      }, { passive: false });

      renderer.domElement.addEventListener('pointermove', (event) => {
        event.preventDefault();
        if (!state.isDragging || state.targetMode !== 'sphere') return;

        const dx = event.clientX - state.lastPointerX;
        const dy = event.clientY - state.lastPointerY;
        state.lastPointerX = event.clientX;
        state.lastPointerY = event.clientY;

        state.targetSphereYaw -= dx * CONFIG.sphereRotateSpeed;
        state.targetSpherePitch = THREE.MathUtils.clamp(
          state.targetSpherePitch + dy * CONFIG.sphereRotateSpeed,
          CONFIG.sphereMinPitch,
          CONFIG.sphereMaxPitch
        );
      }, { passive: false });

      renderer.domElement.addEventListener('pointerup', (event) => {
        event.preventDefault();
        state.isDragging = false;
        if (renderer.domElement.hasPointerCapture(event.pointerId)) {
          renderer.domElement.releasePointerCapture(event.pointerId);
        }
      }, { passive: false });

      renderer.domElement.addEventListener('pointerleave', () => {
        state.isDragging = false;
      });

      renderer.domElement.addEventListener('contextmenu', (event) => event.preventDefault(), { passive: false });

      renderer.domElement.addEventListener('wheel', (event) => {
        event.preventDefault();
        const delta = event.deltaY > 0 ? -CONFIG.wheelZoomStep : CONFIG.wheelZoomStep;
      // 平面模式只允许放大，不允许缩小。
      if (state.targetMode === 'plane' && delta < 0) {
        return;
      }
        state.targetZoomFactor = THREE.MathUtils.clamp(
          state.targetZoomFactor + delta,
          CONFIG.minZoomFactor,
          CONFIG.maxZoomFactor
        );
      }, { passive: false });
    }

    function setMode(nextMode) {
      state.targetMode = nextMode;
      state.targetMorph = nextMode === 'sphere' ? 1 : 0;
      state.isModeTransitioning = true;
      state.isDragging = false;
      if (nextMode === 'sphere') {
        state.targetZoomFactor = 0.94;
        state.targetSphereYaw = -0.18;
        state.targetSpherePitch = -0.08;
      } else {
        state.targetZoomFactor = 1;
      }
      routeGroup.visible = false;
      const nextActionLabel = nextMode === 'sphere' ? '切换到平面' : '切换到球体';
      toggleBtn.setAttribute('aria-label', nextActionLabel);
      toggleBtn.setAttribute('title', nextActionLabel);
      applyLayoutMode(nextMode);
      if (modeText) {
        modeText.textContent = nextMode === 'sphere' ? '当前：固定仰视球体' : '当前：固定平面地图';
      }
    }

    toggleBtn.addEventListener('click', () => {
      setMode(state.targetMode === 'plane' ? 'sphere' : 'plane');
    });

    function onResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      updatePlaneSize();
      updateEarthNightPlaneSize();
    }

    window.addEventListener('resize', onResize);

    createGrid();
    lockUserMovement();
    setFixedPlaneCamera();
    applyLayoutMode('plane');
    updatePlaneSize();

    (async () => {
      /** @type {THREE.Texture | null} */
      let nightTex = null;
      try {
        const texLoader = new THREE.TextureLoader();
        texLoader.setCrossOrigin('anonymous');
        nightTex = await texLoader.loadAsync(CONFIG.earthNightTextureUrl);
        nightTex.colorSpace = THREE.SRGBColorSpace;
        nightTex.anisotropy = Math.min(16, renderer.capabilities.maxAnisotropy || 1);
      } catch (err) {
        console.warn('夜间地球纹理加载失败:', err);
      }
      createSphereSurface(nightTex);
      createEarthNightPlane(nightTex);
      await loadStableWorldData();
      createRoutes();
      createAttackFeed();
      // createGlowDots();
      updatePlaneSize();
      updateEarthNightPlaneSize();
    })();

    const clock = new THREE.Clock();

    let hasRenderFatalError = false;

    function animate() {
      if (hasRenderFatalError) return;

      try {
        const delta = clock.getDelta();
        const time = clock.elapsedTime;

        state.morph = THREE.MathUtils.damp(state.morph, state.targetMorph, CONFIG.morphSpeed, delta);
        state.zoomFactor = THREE.MathUtils.damp(state.zoomFactor, state.targetZoomFactor, 8, delta);

        if (state.isModeTransitioning && Math.abs(state.morph - state.targetMorph) < 0.006) {
          state.morph = state.targetMorph;
          state.isModeTransitioning = false;
        }

        updateLines();
        updateLandMeshes();
        updateSphereSurface();
        updateRoutes(time);
        updateGlowDots(time);
        const sphereSpinWeight = THREE.MathUtils.smoothstep(state.morph, 0.62, 0.98);
        if (sphereSpinWeight > 0.001 && !state.isDragging) {
          state.sphereSpinAngle += CONFIG.sphereAutoRotateSpeed * sphereSpinWeight * delta;
        }
        mapGroup.rotation.y = state.sphereSpinAngle * sphereSpinWeight;
        updateCamera();

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      } catch (error) {
        hasRenderFatalError = true;
        debugLog('渲染循环发生致命错误，已暂停 animate()', error.stack || error.message, 'error');
        throw error;
      }
    }

    debugLog('初始化完成，开始渲染循环', {
      sceneChildren: scene.children.length,
      mapGroupChildren: mapGroup.children.length,
      gridLines: gridGroup.children.length,
      landMeshes: landGroup.children.length,
      borderLines: borderGroup.children.length,
      glowDots: glowGroup.children.length,
      routeObjects: routeGroup.children.length
    });

    animate();
  </script>

  </body>
</html>
